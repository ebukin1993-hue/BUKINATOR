name: Prepare BookinHome 1.3 unsigned release for private signing
on:
  push:
    branches: [bookinhome-design-v13]
    paths:
      - '.github/workflows/bookinhome-v13-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android build tools
        shell: bash
        run: |
          SDKMAN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract release source
        shell: bash
        run: |
          mkdir -p bookinhome/release
          cd bookinhome/release
          base64 -d ../v1.3-source.tar.xz.b64 | tar -xJf -
          grep -q "versionCode 14" app/build.gradle
      - name: Build unsigned release APK
        working-directory: bookinhome/release
        run: gradle :app:assembleRelease --no-daemon
      - name: Align unsigned APK
        shell: bash
        run: |
          IN=bookinhome/release/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=bookinhome/release/bookinhome-1.3-aligned-unsigned.apk
          test -s "$IN"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$IN" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$OUT"
          sha256sum "$OUT"
      - name: Upload release APK for personal signing
        uses: actions/upload-artifact@v4
        with:
          name: BookinHome-1.3-aligned-unsigned
          path: bookinhome/release/bookinhome-1.3-aligned-unsigned.apk
          if-no-files-found: error
      - name: Upload Android signing executable for internal offline use
        uses: actions/upload-artifact@v4
        with:
          name: BookinHome-1.3-apksigner-jar
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
