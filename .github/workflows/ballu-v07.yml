name: Build Ballu Control 0.7 Battery-Safe Android
on:
  push:
    branches: [ballu-control-apk-build]
    paths:
      - 'ballu-control/build-src-v0.7.tar.xz.b64'
      - '.github/workflows/ballu-v07.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        shell: bash
        run: |
          SDKMAN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMAN"
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract v0.7
        run: |
          mkdir -p ballu-control/v07
          cd ballu-control/v07
          base64 -d ../build-src-v0.7.tar.xz.b64 | tar -xJf -
          grep -q "main.removeCallbacks(startupDiscovery)" app/src/main/java/com/ballucontrol/local/MainActivity.java
          grep -q "finder.stop(); // release Android multicast lock" app/src/main/java/com/ballucontrol/local/MainActivity.java
      - name: Run protocol regression tests
        working-directory: ballu-control/v07
        run: |
          mkdir -p /tmp/ballu-v07-tests
          javac -d /tmp/ballu-v07-tests \
            app/src/main/java/com/ballucontrol/local/SyncleoCrypto.java \
            app/src/main/java/com/ballucontrol/local/SyncleoSession.java \
            app/src/main/java/com/ballucontrol/local/BreezerState.java \
            app/src/main/java/com/ballucontrol/local/Co2Policy.java \
            app/src/main/java/com/ballucontrol/local/ShareTokenParser.java \
            app/src/test/java/com/ballucontrol/local/ProtocolSmokeTest.java \
            app/src/test/java/com/ballucontrol/local/ShareTokenParserTest.java
          java -ea -cp /tmp/ballu-v07-tests com.ballucontrol.local.ProtocolSmokeTest
          java -ea -cp /tmp/ballu-v07-tests com.ballucontrol.local.ShareTokenParserTest
      - name: Compile Android APK
        working-directory: ballu-control/v07
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BalluControl-v0.7-Battery-Safe-APK
          path: ballu-control/v07/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
