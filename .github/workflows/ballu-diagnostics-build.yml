name: Build Ballu Diagnostics APK
on:
  push:
    branches: [ballu-control-apk-build]
    paths:
      - 'ballu-diagnostics/build-src-v1.tar.xz.b64'
      - '.github/workflows/ballu-diagnostics-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMAN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMAN" || { echo "sdkmanager unavailable"; exit 1; }
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Ballu Diagnostics source
        run: |
          mkdir -p ballu-diagnostics/project
          cd ballu-diagnostics/project
          base64 -d ../build-src-v1.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/com/ballucontrol/local/DiagnosticActivity.java
          test -f app/build.gradle
      - name: Compile Ballu Diagnostics
        working-directory: ballu-diagnostics/project
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BalluDiagnostics_v1_APK
          path: ballu-diagnostics/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
