name: Build Ballu Diagnostics Android16 Fixed APK
on:
  push:
    branches: [ballu-control-apk-build]
    paths:
      - '.github/workflows/ballu-diagnostics-build.yml'
      - 'ballu-hotfix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMAN="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMAN" || exit 1
          yes | "$SDKMAN" --licenses >/dev/null || true
          "$SDKMAN" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Ballu Diagnostics v1 baseline
        shell: bash
        run: |
          mkdir -p ballu-diagnostics/project
          cd ballu-diagnostics/project
          base64 -d ../build-src-v1.tar.xz.b64 | tar -xJf -
      - name: Apply XDH Android 16 fix and staged errors
        run: python3 ballu-hotfix/apply_hotfix.py ballu-diagnostics/project diagnostics
      - name: Compile Ballu Diagnostics
        working-directory: ballu-diagnostics/project
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: BalluDiagnostics-v1.1-Android16-APK
          path: ballu-diagnostics/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
