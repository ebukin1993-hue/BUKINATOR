name: Build Ballu Control APK
on:
  push:
    branches: [ballu-control-apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract isolated Ballu Control source
        run: |
          mkdir -p ballu-control/project
          cd ballu-control/project
          base64 -d ../build-src-v0.2.tar.xz.b64 | tar -xJf -
          test -f app/build.gradle
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: ballu-control/project
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BalluControl-v0.2-apk
          path: ballu-control/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to this temporary branch
        run: |
          cp ballu-control/project/app/build/outputs/apk/debug/app-debug.apk ballu-control/BalluControl_v0.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ballu-control/BalluControl_v0.2.apk
          git commit -m "Publish temporary Ballu Control v0.2 APK"
          git push origin HEAD:ballu-control-apk-build
