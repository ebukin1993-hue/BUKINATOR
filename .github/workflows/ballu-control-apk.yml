name: Build Ballu Control APK
on:
  push:
    branches: [ballu-control-apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Ballu Control source
        run: |
          mkdir -p ballu-control/project
          cd ballu-control/project
          base64 -d ../build-src-v0.2.tar.xz.b64 | tar -xJf -
          test -f app/build.gradle
      - name: Build debug APK
        working-directory: ballu-control/project
        run: gradle :app:assembleDebug --stacktrace
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: BalluControl-apk
          path: ballu-control/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK on build branch
        run: |
          cp ballu-control/project/app/build/outputs/apk/debug/app-debug.apk ballu-control/BalluControl.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ballu-control/BalluControl.apk
          git commit -m "Build Ballu Control APK" || exit 0
          git push origin HEAD:ballu-control-apk-build
